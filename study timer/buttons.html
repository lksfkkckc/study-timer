<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Study Timer</title>
    </head>

    <body>

        <div class="timer">

            <h1>♡ Study timer ♡</h1>
            
            <div class="time">
                00:00:00
            </div>
            

            <div class="buttons">
                <button>Start</button>
                <button>Pause</button>
                <button>Stop</button>
            </div>

            <div class="pause">
                
            </div>
            
            <div class="stats">

                <p class="stats-title">Today's sessions:</p>

                <div id="sessions">

                    <div class="session-header">
                        <span>Study time</span>
                        <span>Pause time</span>
                        <span>Start time</span>
                    </div>

                </div>

                <p class="stats-title">Today's total:</p>

                <div id="total">
                    00:00:00
                </div>

            </div>
            

        </div>

        <script src="script.js"></script>
        <link rel="stylesheet" href="style.css">
    
    </body>
</html>
